{% extends 'base.html' %}
{% block title %}Draft Generator{% endblock %}
{% block content %}
<h2 class="mb-3">Email / WhatsApp Draft Generator</h2>
<div class="row g-4">
  <div class="col-lg-5">
    <div class="card p-3">
      <form method="post">
        <label class="form-label">Lead</label>
        <select name="lead_id" class="form-select mb-2" required>
          {% for lead in leads %}
            <option value="{{ lead.id }}">{{ lead.company }} ({{ lead.contact_person }})</option>
          {% endfor %}
        </select>
        <label class="form-label">Channel</label>
        <select name="channel" class="form-select mb-2"><option>Email</option><option>WhatsApp</option></select>
        <label class="form-label">Deal Stage</label>
        <select name="deal_stage" class="form-select mb-2">{% for s in status_pipeline %}<option>{{ s }}</option>{% endfor %}</select>
        <label class="form-label">Product Tag</label>
        <select name="product_tag" class="form-select mb-2">{% for p in product_tags %}<option>{{ p }}</option>{% endfor %}</select>
        <button class="btn btn-primary">Generate Draft</button>
      </form>
    </div>
  </div>
  <div class="col-lg-7">
    <div class="card p-3">
      <h5>Generated Draft</h5>
      {% if generated %}
        <pre class="draft-box">{{ generated }}</pre>
      {% else %}
        <p class="text-muted">Select options and generate a draft.</p>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
